<!--Tela de Cadastro-->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="btn btn-ghost btn-sm btn-icon" id="modal-close">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ── CONFIRM ── -->
<div class="modal-overlay" id="confirm-overlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-body" style="text-align:center;padding:28px 24px">
      <svg width="40" height="40" fill="none" stroke="var(--danger)" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom:12px">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="var(--danger)"/>
      </svg>
      <h3 style="font-size:16px;margin-bottom:8px" id="confirm-title">Confirmar exclusão</h3>
      <p class="text-muted" id="confirm-msg">Esta ação não pode ser desfeita.</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Excluir</button>
    </div>
  </div>
</div>
