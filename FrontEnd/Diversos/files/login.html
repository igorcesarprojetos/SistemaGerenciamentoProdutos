<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Sistema de Gerenciamento de Produtos</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div id="toast-container"></div>

<!-- ── LOGIN ── -->
<div id="screen-login">
  <div class="login-card">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg width="26" height="26" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
          <path d="M16 3H8L6 7h12l-2-4z"/>
        </svg>
      </div>
      <h2>Gerenciamento de Produtos</h2>
      <p>Entre com suas credenciais para continuar</p>
    </div>
    <div class="form-group mb-1">
      <label>Login</label>
      <input type="text" id="login-user" placeholder="seu.login" autocomplete="username">
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btn-login" style="width:100%;margin-top:20px;justify-content:center;padding:10px 16px">
      Entrar
    </button>
    <p id="login-error" class="text-danger" style="font-size:12px;margin-top:10px;text-align:center;display:none"></p>
  </div>
</div>

<script src="common.js"></script>
<script src="login.js"></script>
</body>
</html>
