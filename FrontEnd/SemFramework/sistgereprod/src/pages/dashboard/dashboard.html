<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Sistema de Gerenciamento de Produtos</title>
<link rel="stylesheet" href="../../assests/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h1>GerenciaProd</h1>
      <span id="sidebar-empresa">—</span>
    </div>
    <nav>
      <div class="nav-section">Principal</div>
      <a class="active" href="dashboard.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="../produtos/produtos.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L6 7h12l-2-4z"/></svg>
        Produtos
      </a>
      <div class="nav-section">Cadastros</div>
      <a href="../empresas/empresas.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M9 21V7l6-4v18M3 9h6"/></svg>
        Empresas
      </a>
      <a href="../usuarios/usuarios.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.38 8.38 0 0113 0"/></svg>
        Usuários
      </a>
      <a href="../perfis/perfis.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Perfis
      </a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <strong id="user-name">—</strong>
        <span id="user-perfil">—</span>
      </div>
      <button class="btn-logout" id="btn-logout" title="Sair">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main>
    <header>
      <div class="header-title">Dashboard</div>
      <div class="header-actions"></div>
    </header>

    <div class="content">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">
            <svg width="14" height="14" fill="none" stroke="var(--primary)" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/></svg>
            Produtos
          </div>
          <div class="stat-value" id="stat-produtos">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">
            <svg width="14" height="14" fill="none" stroke="var(--info)" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M9 21V7l6-4v18"/></svg>
            Empresas
          </div>
          <div class="stat-value" id="stat-empresas">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">
            <svg width="14" height="14" fill="none" stroke="var(--warning)" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.38 8.38 0 0113 0"/></svg>
            Usuários
          </div>
          <div class="stat-value" id="stat-usuarios">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">
            <svg width="14" height="14" fill="none" stroke="var(--danger)" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Perfis
          </div>
          <div class="stat-value" id="stat-perfis">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Produtos Recentes</h3>
        </div>
        <div id="dashboard-table">
          <div class="loading"><span class="spinner"></span>Carregando...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../../common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
