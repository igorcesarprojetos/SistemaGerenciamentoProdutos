<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfis · Sistema de Gerenciamento de Produtos</title>
<link rel="stylesheet" href="../../assests/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div id="toast-container"></div>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h1>GerenciaProd</h1>
      <span id="sidebar-empresa">—</span>
    </div>
    <nav>
      <div class="nav-section">Principal</div>
      <a href="../dashboard/dashboard.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="../produtos/produtos.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v6a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L6 7h12l-2-4z"/></svg>
        Produtos
      </a>
      <div class="nav-section">Cadastros</div>
      <a href="../empresas/empresas.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M9 21V7l6-4v18M3 9h6"/></svg>
        Empresas
      </a>
      <a href="../usuarios/usuarios.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.38 8.38 0 0113 0"/></svg>
        Usuários
      </a>
      <a class="active" href="perfis.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Perfis
      </a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <strong id="user-name">—</strong>
        <span id="user-perfil">—</span>
      </div>
      <button class="btn-logout" id="btn-logout" title="Sair">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main>
    <header>
      <div class="header-title">Perfis</div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" id="btn-new-perfil">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Novo Perfil
        </button>
      </div>
    </header>

    <div class="content">
      <div class="toolbar">
        <div class="search-wrap">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search-perfis" placeholder="Buscar perfil...">
        </div>
      </div>
      <div class="card">
        <div id="table-perfis"><div class="loading"><span class="spinner"></span>Carregando...</div></div>
      </div>
    </div>
  </main>
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="btn btn-ghost btn-sm btn-icon" id="modal-close">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ── CONFIRM ── -->
<div class="modal-overlay" id="confirm-overlay">
  <div class="modal" style="max-width:380px">
    <div class="modal-body" style="text-align:center;padding:28px 24px">
      <svg width="40" height="40" fill="none" stroke="var(--danger)" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom:12px">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".5" fill="var(--danger)"/>
      </svg>
      <h3 style="font-size:16px;margin-bottom:8px" id="confirm-title">Confirmar exclusão</h3>
      <p class="text-muted" id="confirm-msg">Esta ação não pode ser desfeita.</p>
    </div>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Excluir</button>
    </div>
  </div>
</div>

<script src="../../common.js"></script>
<script src="perfis.js"></script>
</body>
</html>
